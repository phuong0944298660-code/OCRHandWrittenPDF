server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

id995a:
  template-path: ${TEMPLATE_PATH:../official_templates/students/ID995A_来港就读申请表_申请人.pdf}
  rules-path: ${RULES_PATH:../official_templates/students/ID995A_审核规则.html}

ocr:
  tasks-dir: ${OCR_TASKS_DIR:uploads/ocr-tasks}
  field-service:
    base-url: ${FIELD_OCR_BASE_URL:http://127.0.0.1:8091}
    timeout-seconds: ${FIELD_OCR_TIMEOUT_SECONDS:300}
  tesseract:
    enabled: ${OCR_ENABLED:true}
    language: ${OCR_LANGUAGE:eng+chi_sim+chi_tra}
    data-path: ${TESSDATA_PREFIX:}
  paddle:
    base-url: ${PADDLE_OCR_BASE_URL:http://192.168.20.250:18080}
    timeout-seconds: ${PADDLE_OCR_TIMEOUT_SECONDS:180}
    top-p: ${PADDLE_OCR_TOP_P:1.0}
    visualize: ${PADDLE_OCR_VISUALIZE:true}

llm:
  enabled: ${LLM_ENABLED:false}
  base-url: ${LLM_BASE_URL:https://apie.zhisuaninfo.com/v1}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:Qwen3-Omni-30B-A3B-Instruct}
  max-tokens: ${LLM_MAX_TOKENS:256}
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:60}

rag:
  enabled: ${RAG_ENABLED:false}
  base-url: ${RAG_BASE_URL:http://127.0.0.1:8090}
  timeout-seconds: ${RAG_TIMEOUT_SECONDS:30}
  top-k: ${RAG_TOP_K:8}
