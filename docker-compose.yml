services:
  rag-service:
    build:
      context: ./rag-service
    container_name: id995a-rag
    ports:
      - "8090:8090"
    volumes:
      - ./docs/official_templates:/app/official_templates:ro
    environment:
      - EMBEDDING_ENABLED=false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ocr-service:
    build:
      context: ./ocr-service
    container_name: id988a-field-ocr
    ports:
      - "8091:8091"
    environment:
      - PP_OCR_DET_URL=${PP_OCR_DET_URL:-http://host.docker.internal:8001/predict}
      - PP_OCR_REC_URL=${PP_OCR_REC_URL:-http://host.docker.internal:8002/predict}
      - PP_OCR_TIMEOUT_SECONDS=${PP_OCR_TIMEOUT_SECONDS:-60}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: id995a-backend
    ports:
      - "8080:8080"
    volumes:
      - ./docs/official_templates:/app/official_templates:ro
      - ./uploads:/app/uploads
    environment:
      - TEMPLATE_PATH=/app/official_templates/students/ID995A_来港就读申请表_申请人.pdf
      - RULES_PATH=/app/official_templates/students/ID995A_审核规则.html
      - RAG_ENABLED=true
      - RAG_BASE_URL=http://rag-service:8090
      - LLM_ENABLED=false
      - FIELD_OCR_BASE_URL=http://ocr-service:8091
      - FIELD_OCR_TIMEOUT_SECONDS=300
      - OCR_TASKS_DIR=/app/uploads/ocr-tasks
    depends_on:
      rag-service:
        condition: service_healthy
      ocr-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: id995a-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
